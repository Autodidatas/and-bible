name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: 📥 Checkout
      uses: actions/checkout@v4

    - name: ☕ Setup Java 17
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: 17

    - name: 🤖 Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: 🔧 Permissão Gradle
      run: chmod +x ./gradlew

    - name: 🔥 Build APK (versão estável)
      run: ./gradlew assembleStandardDebug --no-daemon --stacktrace

    - name: 📦 Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: apk
        path: "**/*.apk"
